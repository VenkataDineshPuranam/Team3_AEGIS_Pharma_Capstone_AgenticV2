<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS-PHARMA V3 — Architecture Explorer</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --canvas: #fbfcfd;
    --ink: #16202c;
    --ink-2: #5a6675;
    --ink-3: #8b96a4;
    --line: #dfe4ea;
    --line-2: #eef1f4;
    --edge: #9aa5b1;
    --edge-hl: #1c6fd6;
    --accent: #1c6fd6;
    --accent-soft: #e8f1fd;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);

    --ok: #1f8a4c;      --ok-bg: #e8f6ed;
    --warn: #b8860b;    --warn-bg: #fdf5e2;
    --danger: #c23934;  --danger-bg: #fdeceb;
    --info: #1c6fd6;    --info-bg: #eaf2fd;
    --neutral: #8b96a4; --neutral-bg: #f2f4f7;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1319; --panel: #151b23; --canvas: #111820; --ink: #e7edf4; --ink-2: #9dabbb;
      --ink-3: #6d7b8b; --line: #26303c; --line-2: #1d252f; --edge: #566475; --edge-hl: #66a8ff;
      --accent: #66a8ff; --accent-soft: #16283f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --ok: #52c07d; --ok-bg: #14291d; --warn: #e3b341; --warn-bg: #2b2413;
      --danger: #f0736c; --danger-bg: #2e1717; --info: #66a8ff; --info-bg: #14243a;
      --neutral: #7d8b9c; --neutral-bg: #1c242e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1319; --panel: #151b23; --canvas: #111820; --ink: #e7edf4; --ink-2: #9dabbb;
    --ink-3: #6d7b8b; --line: #26303c; --line-2: #1d252f; --edge: #566475; --edge-hl: #66a8ff;
    --accent: #66a8ff; --accent-soft: #16283f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --ok: #52c07d; --ok-bg: #14291d; --warn: #e3b341; --warn-bg: #2b2413;
    --danger: #f0736c; --danger-bg: #2e1717; --info: #66a8ff; --info-bg: #14243a;
    --neutral: #7d8b9c; --neutral-bg: #1c242e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; gap: 1px; margin-right: 4px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .brand .sub { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); }

  .tabs { display: flex; gap: 4px; background: var(--line-2); padding: 3px; border-radius: 9px; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-size: 13px; font-weight: 550; padding: 6px 13px;
    border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  .spacer { flex: 1 1 auto; }
  .tools { display: flex; align-items: center; gap: 6px; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { color: var(--ink); border-color: var(--edge); }
  .btn.icon { padding: 5px 8px; font-family: var(--mono); }

  .body { flex: 1 1 auto; display: flex; min-height: 0; }

  .stage-wrap { flex: 1 1 auto; position: relative; min-width: 0; background: var(--canvas); }
  svg.stage { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.stage.dragging { cursor: grabbing; }

  .viewnote {
    position: absolute; left: 16px; bottom: 16px; right: 16px; max-width: 620px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 13px; font-size: 12.5px; color: var(--ink-2); box-shadow: var(--shadow);
    pointer-events: none;
  }
  .viewnote b { color: var(--ink); font-weight: 600; }

  .zoombar {
    position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 5px;
  }
  .zoombar .btn { justify-content: center; }

  /* ---------- side panel ---------- */
  aside.panel {
    width: 400px; flex: 0 0 400px; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0 0 3px; font-size: 13px; font-weight: 650; letter-spacing: .01em; }
  .panel-head p { margin: 0; font-size: 12px; color: var(--ink-3); }

  .flowlist { flex: 1 1 auto; overflow-y: auto; padding: 10px; }

  .flow {
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
    background: var(--panel); overflow: hidden; transition: border-color .12s, box-shadow .12s;
  }
  .flow:hover { border-color: var(--edge); }
  .flow.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .flow > button {
    appearance: none; width: 100%; text-align: left; border: 0; background: transparent;
    color: inherit; font: inherit; padding: 11px 13px; cursor: pointer; display: block;
  }
  .flow .ftitle { display: flex; align-items: baseline; gap: 8px; }
  .flow .fname { font-weight: 600; font-size: 13px; flex: 1 1 auto; }
  .flow .fcount {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    border: 1px solid var(--line); border-radius: 20px; padding: 1px 7px; white-space: nowrap;
  }
  .flow .fsum { margin: 5px 0 0; font-size: 12px; color: var(--ink-2); }
  .flow .kind {
    display: inline-block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-bottom: 6px;
    background: var(--info-bg); color: var(--info);
  }
  .flow .kind.invariant { background: var(--warn-bg); color: var(--warn); }

  .steps { border-top: 1px dashed var(--line); padding: 8px 10px 11px; }
  .step {
    display: flex; gap: 9px; align-items: flex-start; padding: 6px 7px; border-radius: 7px;
    cursor: pointer;
  }
  .step:hover { background: var(--line-2); }
  .step.on { background: var(--accent-soft); }
  .step .num {
    flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--edge); color: #fff;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .step.on .num { background: var(--accent); }
  .step .stext { flex: 1 1 auto; min-width: 0; }
  .step .slabel { font-size: 12.5px; font-weight: 550; }
  .step .snote { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }

  .stepnav { display: flex; gap: 6px; align-items: center; padding: 8px 10px 0; }
  .stepnav .btn { flex: 0 0 auto; }
  .stepnav .pos { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-left: auto; }

  .legend { border-top: 1px solid var(--line); padding: 11px 16px 14px; }
  .legend h3 { margin: 0 0 7px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
  .legend .items { display: flex; flex-wrap: wrap; gap: 5px 12px; }
  .legend .li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid; }
  .legend .foot { margin: 9px 0 0; font-size: 11px; color: var(--ink-3); }
  .legend .foot code { font-family: var(--mono); font-size: 10.5px; }

  /* ---------- svg ---------- */
  .cluster-box { fill: var(--line-2); stroke: var(--line); stroke-width: 1; rx: 12; }
  .cluster-label { fill: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

  .node { cursor: pointer; }
  .node rect.box { stroke-width: 1.6; rx: 9; }
  .node text { pointer-events: none; }
  .node .nlabel { font-size: 12px; font-weight: 570; }
  .node .nbadge { font-size: 9.8px; font-style: italic; }
  .node:hover rect.box { stroke-width: 2.6; }

  .edge path { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .edge.dashed path { stroke-dasharray: 5 4; }
  .edge .elabel { font-size: 10px; fill: var(--ink-3); }
  .edge .ehit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }

  .dim { opacity: .13; }
  .edge.hl path { stroke: var(--edge-hl); stroke-width: 2.6; }
  .edge.hl .elabel { fill: var(--edge-hl); font-weight: 600; }
  .edge.focus path { stroke-width: 4; }
  .edge.focus .ehit { stroke-width: 0; }
  .node.hl rect.box { stroke-width: 2.8; }
  .node.hl rect.ring { fill: none; stroke: var(--edge-hl); stroke-width: 2; opacity: .55; rx: 13; }

  .stepbadge circle { fill: var(--edge-hl); }
  .stepbadge text { fill: #fff; font-family: var(--mono); font-size: 10px; font-weight: 700; text-anchor: middle; }
  .node.focus rect.ring { stroke-width: 3.5; opacity: 1; }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed; z-index: 50; max-width: 330px; pointer-events: none; opacity: 0;
    transition: opacity .1s; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 10px 12px; font-size: 12px;
  }
  .tip.on { opacity: 1; }
  .tip .t-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .tip .t-dot { width: 9px; height: 9px; border-radius: 3px; border: 1.5px solid; flex: 0 0 auto; }
  .tip .t-name { font-weight: 650; font-size: 12.5px; }
  .tip .t-kind { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .tip .t-body { color: var(--ink-2); }
  .tip .t-src { margin-top: 7px; padding-top: 6px; border-top: 1px dashed var(--line); font-family: var(--mono); font-size: 10px; color: var(--ink-3); word-break: break-word; }

  @media (max-width: 940px) {
    .app { height: auto; }
    .body { flex-direction: column; }
    .stage-wrap { height: 62vh; min-height: 380px; }
    aside.panel { width: auto; flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--line); }
    .flowlist { max-height: none; }
    .viewnote { max-width: none; }
  }
</style>
</head>

rective.","source":"docs/adr/decision_index.md"},{"id":"S5","view":"current","cluster":"c_done","kind":"stage","status":"ok","label":"Stage 05\nCurrent state","badge":"this measurement","x":770,"y":86,"w":160,"h":64,"tooltip":"Re-measurement of the repo in its post-ADR position: 249 tracked files, zero implementation. The honest baseline every later claim is measured against.","source":"docs/product/state/current/current_state_assessment.md"},{"id":"P1","view":"current","cluster":"c_pending","kind":"stage","status":"neutral","label":"Stages 06–09\ninterim · final · graphical · DMAIC","x":50,"y":236,"w":200,"h":64,"tooltip":"Transition and target state definition plus the DMAIC/Lean workbook. Stages 06, 07 and 08 are now complete; 09 remains.","source":"STAGES.md"},{"id":"P2","view":"current","cluster":"c_pending","kind":"stage","status":"neutral","label":"Stages 10–13\nagentic arch · MCP · skills+hooks · ontology","x":282,"y":236,"w":200,"h":64,"tooltip":"The build-design stages: LangGraph graph design, MCP tool contracts, the Prohibited-Action Guard as an enforced hook, and enough semantic layer for scoped status-aware retrieval.","source":"STAGES.md"},{"id":"P3","view":"current","cluster":"c_pending","kind":"stage","status":"neutral","label":"Stages 14–19\neval-cache · perf · governance · observability · security · compliance","x":514,"y":236,"w":200,"h":64,"tooltip":"The assurance stages. Unblocked by EAB-3's closure, since named accountable approvers are a precondition for the governance and compliance work.","source":"STAGES.md"},{"id":"P4","view":"current","cluster":"c_pending","kind":"stage","status":"neutral","label":"Stages 20–21\nimplementation · documentation","x":746,"y":236,"w":200,"h":64,"tooltip":"Implementation is deliberately last. Unblocked by EAB-2's closure — cloud-connected operation confirmed, so the hosted dependencies are ratified rather than assumed.","source":"STAGES.md"},{"id":"B1","view":"current","cluster":"c_block","kind":"blocker","status":"ok","label":"EAB-2 — air-gap?  CLOSED","badge":"cloud-connected confirmed","x":50,"y":386,"w":250,"h":64,"tooltip":"Was the system required to run air-gapped? Sponsor confirmed cloud-connected operation is acceptable. The air-gapped variant is recorded as a known limitation in ADR-007 rather than silently dropped.","source":"docs/adr/ADR-007-degraded-mode-safe-not-offline-capable.md"},{"id":"B2","view":"current","cluster":"c_block","kind":"blocker","status":"ok","label":"EAB-3 — HITL approvers?  CLOSED","badge":"named from V2 stakeholder pack","x":320,"y":386,"w":250,"h":64,"tooltip":"Who is accountable for each workflow's human sign-off? Roles taken verbatim from V2's STAKEHOLDER_PACK.md — EU Qualified Person, Global Head of Pharmacovigilance, Supply Chain VP with Quality co-approval. Not invented.","source":"docs/governance/hitl_control_model.md"},{"id":"R1","view":"current","cluster":"c_real","kind":"artefact","status":"ok","label":"docs/ — 59 files\nadr · architecture · product","x":50,"y":536,"w":200,"h":64,"tooltip":"The substantive design output: discovery, SCQA, DDD, C4, nine ADRs, the three state documents and this graphical stage.","source":"docs/"},{"id":"R2","view":"current","cluster":"c_real","kind":"artefact","status":"ok","label":"prompts/ — 25 files\n13 adapted + 10 new","x":282,"y":536,"w":200,"h":64,"tooltip":"The stage-driving prompts. Thirteen adapted from V2, ten written for V3's agentic stages.","source":"prompts/"},{"id":"R3","view":"current","cluster":"c_real","kind":"artefact","status":"ok","label":"workshop/ — 47 files\nmirrors of stages 01–04","x":514,"y":536,"w":200,"h":64,"tooltip":"Participant-facing mirrors of each completed stage's output, so the workshop track stays in step with the canonical docs/ tree.","source":"workshop/participant-output/"},{"id":"R4","view":"current","cluster":"c_real","kind":"artefact","status":"warn","label":"eval-ai-cache/ — 29 files\nUNCONSUMED","x":746,"y":536,"w":200,"h":64,"tooltip":"The notable box. 29 files of directly-applicable reference material — a 24-file brownfield-evals runbook, a Redis caching runbook, an OpenTelemetry runbook — that no stage has drawn on yet. Stages 14/15/17 should consume it rather than derive equivalents (NAB-4).","source":"eval-ai-cache/"},{"id":"T1c","view":"current","cluster":"c_stub","kind":"artefact","status":"neutral","label":"apps/ services/ packages/ tests/\n0 implementation","x":50,"y":686,"w":200,"h":64,"tooltip":"README stubs only. Every C4 container has a named home here, but nothing has been written — Stage 20 is deliberately last.","source":"apps/, services/, packages/, tests/"},{"id":"T2c","view":"current","cluster":"c_stub","kind":"artefact","status":"neutral","label":"security/ ops/ infra/\nquality/ deploy/","x":282,"y":686,"w":200,"h":64,"tooltip":"Operational scaffolding awaiting Stages 15–19. Structure exists so later stages have an unambiguous destination.","source":"security/, ops/, infra/, quality/, deploy/"},{"id":"T3c","view":"current","cluster":"c_stub","kind":"artefact","status":"neutral","label":"evidence/ — 0 records\n(correct: nothing has run)","x":514,"y":686,"w":200,"h":64,"tooltip":"Emptiness here is correct, not a gap. Evidence records are produced by real runs; asserting them before the system runs would be the defect.","source":"evidence/"},{"id":"T4c","view":"current","cluster":"c_stub","kind":"artefact","status":"neutral","label":"templates/ — 10 blank","x":746,"y":686,"w":200,"h":64,"tooltip":"ADR, change-plan, threat-model, incident-record and other templates, ready but unfilled.","source":"templates/"},{"id":"USER","view":"interim","kind":"actor","status":"ok","label":"EU Qualified Person","badge":"named approver — EAB-3 closed","x":420,"y":38,"w":240,"h":60,"tooltip":"The accountable human for Batch Review. Their own mandate in V2's stakeholder pack already states that final certification remains human-only — which is exactly the boundary ADR-004 enforces structurally. Escalation: Chief Quality Officer.","source":"docs/governance/hitl_control_model.md §2"},{"id":"UI","view":"interim","cluster":"i_app","kind":"app","status":"info","label":"Batch Review view","x":430,"y":146,"w":220,"h":56,"tooltip":"The single UI surface in the interim state — workflow input and decision-support output for one workflow only.","source":"docs/architecture/c4/c4_containers.md"},{"id":"BA","view":"interim","cluster":"i_orch","kind":"agent","status":"info","label":"Batch-Review\nAgent node","x":400,"y":278,"w":280,"h":60,"tooltip":"The one domain agent in the interim slice. May propose evidence reconciliation and flag deviations/gaps. Its aggregate schema has no release/reject field — the prohibited action is unrepresentable, not merely unrecommended.","source":"docs/architecture/ddd/domain_model.md §10"},{"id":"CV","view":"interim","cluster":"i_orch","kind":"critic","status":"info","label":"Critic / Verifier\nnode","x":400,"y":368,"w":280,"h":60,"tooltip":"Checks every proposed output against the prohibited-action contract and evidence-citation completeness before it can reach a human. Never modifies domain output — it either approves-for-human-review or rejects back to the domain agent.","source":"docs/architecture/c4/c4_components.md"},{"id":"HITL","view":"interim","cluster":"i_orch","kind":"policy","status":"info","label":"HITL interrupt handler","x":400,"y":456,"w":280,"h":56,"tooltip":"Pauses graph execution, notifies the named approver role, and enforces default-safe-on-timeout: no action, never auto-proceed. Silence from a reviewer is never approval.","source":"docs/architecture/ddd/domain_model.md §11"},{"id":"IT1","view":"interim","cluster":"i_tools","kind":"tool","status":"info","label":"Evidence Retrieval","badge":"scoped, read-only","x":60,"y":278,"w":260,"h":60,"tooltip":"Retrieval scoped per bounded context — a Batch Review agent retrieves only from Batch Review's evidence scope, never PV or Supply. Filters non-citable documents at the retrieval boundary so they never enter the context window.","source":"docs/architecture/c4/c4_components.md"},{"id":"IT2","view":"interim","cluster":"i_tools","kind":"tool","status":"info","label":"Reconciliation","badge":"read-only","x":60,"y":358,"w":260,"h":60,"tooltip":"Structured evidence-completeness and conflict check for Batch Review. Read-only — no write capability to any brownfield system exists anywhere in this architecture.","source":"docs/architecture/c4/c4_components.md"},{"id":"PAG","view":"interim","cluster":"i_gov","kind":"policy","status":"warn","label":"Prohibited-Action Guard","badge":"present from day one","x":760,"y":368,"w":240,"h":60,"tooltip":"Not staged in later. ADR-004's argument is that prohibited-action enforcement cannot be retrofitted safely, so the guard is present in the very first slice — as an enforced hook, not an instruction.","source":"docs/adr/ADR-004-prohibited-actions-structurally-unrepresentable.md"},{"id":"EP","view":"interim","kind":"store","status":"warn","label":"Evidence & Provenance","badge":"untrusted + superseded NON-CITABLE","x":60,"y":468,"w":260,"h":68,"tooltip":"The deterministic status gate. Verification against V2's authority_grader.py (_MUST_NOT_CITE = {untrusted, superseded}) proved that superseded is non-citable exactly like untrusted — correcting an error in the original DDD model. Retrieved content may never alter its own authority.","source":"docs/adr/ADR-003-evidence-authority-deterministic-gate.md"},{"id":"AUD","view":"interim","kind":"store","status":"info","label":"Audit / Evidence Log Store","badge":"minimal, but present","x":760,"y":468,"w":240,"h":68,"tooltip":"Owned, and deliberately separate from LangSmith — compliance retention requirements may differ from trace retention, and this store must survive a degraded hosted-observability integration. ADR-006 says it must not be an afterthought.","source":"docs/adr/ADR-006-audit-store-separate-from-langsmith.md"},{"id":"LS","view":"interim","kind":"external","status":"neutral","label":"LangSmith — tracing","x":760,"y":248,"w":240,"h":56,"tooltip":"Tracing from the start, so there is trace data to reason about when the seven assumptions are tested. Additive observability, not a hard dependency: if LangSmith is unreachable the request must still succeed.","source":"docs/architecture/c4/boundary_and_degraded_mode.md"},{"id":"SRC","view":"interim","kind":"external","status":"neutral","label":"Manufacturing · Lab · Quality","badge":"READ-ONLY","x":60,"y":568,"w":260,"h":60,"tooltip":"Brownfield source systems. Every arrow in is read-only evidence flow; there is no arrow out. No container in this system has outbound write capability to any of them.","source":"docs/architecture/c4/c4_context.md"},{"id":"NOCACHE","view":"interim","kind":"excluded","status":"danger","label":"Redis cache","badge":"DELIBERATELY EXCLUDED","x":760,"y":568,"w":240,"h":60,"tooltip":"Caching adds stale-authority correctness risk on top of agent-correctness risk. Introducing both at once makes failures ambiguous. Cache lands only after the uncached path is proven correct.","source":"docs/product/state/interim/interim_state.md §2"},{"id":"A1","view":"interim","cluster":"i_assume","kind":"assumption","status":"danger","label":"1 · Prohibited action fails at SCHEMA layer","badge":"stop-the-line","x":60,"y":716,"w":210,"h":66,"tooltip":"Pass condition: a red-team attempt to produce a batch release/reject recommendation fails at the schema layer, not merely by model refusal. If this fails the design itself is invalid, not just incomplete.","source":"docs/product/state/interim/interim_state.md §3"},{"id":"A2","view":"interim","cluster":"i_assume","kind":"assumption","status":"danger","label":"2 · untrusted/superseded never cited","badge":"stop-the-line","x":290,"y":716,"w":210,"h":66,"tooltip":"Pass condition: zero citations of untrusted or superseded documents, and an embedded instruction inside a retrieved document does not change agent behaviour.","source":"docs/product/state/interim/interim_state.md §3"},{"id":"A3","view":"interim","cluster":"i_assume","kind":"assumption","status":"info","label":"3 · HITL routing + default-safe timeout","x":520,"y":716,"w":210,"h":66,"tooltip":"Pass condition: escalation fires as designed, and a timed-out approval results in no action — never auto-proceed.","source":"docs/product/state/interim/interim_state.md §3"},{"id":"A4","view":"interim","cluster":"i_assume","kind":"assumption","status":"info","label":"4 · Degraded mode safe","x":750,"y":716,"w":210,"h":66,"tooltip":"Pass condition: with the LLM provider disabled the deterministic path still runs and the system abstains rather than guessing; with LangSmith disabled requests still succeed and audit records still write.","source":"docs/adr/ADR-007-degraded-mode-safe-not-offline-capable.md"},{"id":"A5","view":"interim","cluster":"i_assume","kind":"assumption","status":"info","label":"5 · Policy Engine fails CLOSED","x":60,"y":806,"w":210,"h":66,"tooltip":"Pass condition: with the Policy Engine unreachable, requests are refused — not passed through.","source":"docs/adr/ADR-005-governance-as-separate-container.md"},{"id":"A7","view":"interim","cluster":"i_assume","kind":"assumption","status":"info","label":"7 · Hop count ≈ 7","x":290,"y":806,"w":210,"h":66,"tooltip":"Pass condition: the measured path matches the 7 container/component boundary crossings counted in the C4 DMAIC lens, or there is a documented reason why not. Any design change raising this count needs explicit justification.","source":"docs/architecture/c4/dmaic_lens.md"},{"id":"A6","view":"interim","cluster":"i_assume","kind":"assumption","status":"warn","label":"6 · Token / cost per run","badge":"first real measurement","x":520,"y":806,"w":210,"h":66,"tooltip":"Carries disproportionate weight: it is the first point in the entire programme where a real cost number exists. Every token/cost decision so far has been explicitly marked Unknown. If it lands far off expectation, the final state's topology changes before it is built three times over.","source":"docs/product/state/interim/interim_state.md §3"},{"id":"GATE","view":"interim","cluster":"i_assume","kind":"gate","status":"ok","label":"Proceed to final state?","x":750,"y":806,"w":210,"h":66,"tooltip":"The interim state's exit criteria. All seven assumptions must pass before the pattern is replicated across three workflows.","source":"docs/product/state/interim/interim_state.md §3"},{"id":"QA","view":"final","kind":"actor","status":"ok","label":"EU Qualified Person","badge":"Batch Review approver","x":190,"y":38,"w":190,"h":60,"tooltip":"Primary approver for Batch Review; also the Quality co-approver for Supply Planning options that touch quality status. Escalation: Chief Quality Officer. Explicitly not an approver: Manufacturing VP — 'never independent batch release'.","source":"docs/governance/hitl_control_model.md §2"},{"id":"PVP","view":"final","kind":"actor","status":"ok","label":"Global Head of PV","badge":"PV Intake approver","x":410,"y":38,"w":190,"h":60,"tooltip":"Approves 100% of causality, seriousness and reportability determinations — the agent structurally cannot make them. Medical escalation: Chief Medical Officer. Advisory veto: Patient Safety Representative.","source":"docs/governance/hitl_control_model.md §2"},{"id":"SC","view":"final","kind":"actor","status":"ok","label":"Supply Chain VP","badge":"+ Quality co-approver","x":630,"y":38,"w":190,"h":60,"tooltip":"Dual approval. The stakeholder pack limits the VP to planning and states that regulated execution needs approvals — so any option touching quality status, cold-chain excursion disposition or release needs Quality sign-off in addition.","source":"docs/governance/hitl_control_model.md §2"},{"id":"ADM","view":"final","kind":"app","status":"info","label":"Admin — run inspector, eval dashboards","x":930,"y":38,"w":230,"h":60,"tooltip":"Operator surface over traces, evals and cost/latency dashboards. Reads observability rather than driving workflows.","source":"docs/architecture/c4/c4_containers.md"},{"id":"WEB","view":"final","kind":"app","status":"info","label":"Web App","x":410,"y":138,"w":230,"h":60,"tooltip":"Human-facing views for all three workflows: workflow input, decision-support output, and the HITL approval queue. A presentation layer over the three core contexts — it owns no decisions.","source":"docs/architecture/c4/c4_containers.md"},{"id":"FA1","view":"final","cluster":"f_g1","kind":"agent","status":"info","label":"Batch-Review Agent","x":74,"y":298,"w":200,"h":56,"tooltip":"Proposes evidence reconciliation and flags deviations/gaps. Escalates on any conflict it cannot resolve deterministically, or any output that would resemble a release/reject signal even implicitly.","source":"docs/architecture/ddd/domain_model.md §10"},{"id":"FC1","view":"final","cluster":"f_g1","kind":"critic","status":"info","label":"Critic","x":74,"y":368,"w":200,"h":56,"tooltip":"The Critic/Verifier pattern applied within Graph A. Interacts through the common DecisionSupportOutput contract, so it never absorbs batch-review-specific vocabulary — that contract is the anti-corruption layer.","source":"docs/architecture/ddd/context_map.md"},{"id":"FA2","view":"final","cluster":"f_g2","kind":"agent","status":"info","label":"PV-Intake Agent","x":322,"y":298,"w":200,"h":56,"tooltip":"Triages and prioritises signals and suggests terminology normalisation. Causality, seriousness, expectedness and reportability fields do not exist in this agent's output schema at all.","source":"docs/architecture/ddd/domain_model.md §10"},{"id":"FC2","view":"final","cluster":"f_g2","kind":"critic","status":"info","label":"Critic","x":322,"y":368,"w":200,"h":56,"tooltip":"The Critic/Verifier pattern applied within Graph B, checking prohibited-action adjacency and evidence-citation completeness before anything reaches the Global Head of PV.","source":"docs/architecture/c4/c4_components.md"},{"id":"FA3","view":"final","cluster":"f_g3","kind":"agent","status":"info","label":"Supply-Planning Agent","x":570,"y":298,"w":200,"h":56,"tooltip":"Generates ranked, non-executing options. Escalates on any request that would require writing an allocation or reservation — and has no tool capable of that write, by design.","source":"docs/architecture/ddd/domain_model.md §10"},{"id":"FC3","view":"final","cluster":"f_g3","kind":"critic","status":"info","label":"Critic","x":570,"y":368,"w":200,"h":56,"tooltip":"The Critic/Verifier pattern applied within Graph C. ShortageOption value objects are checked for any allocated_quantity-shaped field, which must never appear.","source":"docs/architecture/ddd/domain_model.md §13"},{"id":"FT1","view":"final","cluster":"f_tools","kind":"tool","status":"info","label":"Evidence Retrieval","badge":"shared, context-scoped","x":60,"y":530,"w":250,"h":66,"tooltip":"The one shared tool — but scoped per bounded context, so a Batch Review agent can never retrieve PV or Supply knowledge. Filters untrusted and superseded at the retrieval boundary.","source":"docs/architecture/c4/c4_components.md"},{"id":"FT2","view":"final","cluster":"f_tools","kind":"tool","status":"info","label":"Reconciliation","badge":"Batch Review only","x":340,"y":530,"w":250,"h":66,"tooltip":"Structured evidence-completeness and conflict check. Read-only, bound to one workflow.","source":"docs/architecture/c4/c4_components.md"},{"id":"FT3","view":"final","cluster":"f_tools","kind":"tool","status":"info","label":"Duplicate-Check","badge":"PV Intake only","x":620,"y":530,"w":250,"h":66,"tooltip":"Case-duplicate detection. The PVCase aggregate's invariant requires the duplicate evaluation to complete before SignalTriaged can fire.","source":"docs/architecture/ddd/domain_model.md §7"},{"id":"FT4","view":"final","cluster":"f_tools","kind":"tool","status":"warn","label":"Option-Generation","badge":"no allocate method","x":900,"y":530,"w":250,"h":66,"tooltip":"Constraint-filtered candidate option generation, and structurally has no allocation or reservation write method at all. A tool-capability constraint, not a permission the agent chooses not to use.","source":"docs/architecture/c4/c4_components.md"},{"id":"GOV","view":"final","kind":"policy","status":"warn","label":"Governance / Policy Engine","badge":"fails CLOSED (ADR-005)","x":880,"y":226,"w":280,"h":66,"tooltip":"Prohibited-Action Guard, HITL Router and Policy Register loader. A separate container so the policy contract is versioned and deployed independently and cannot be silently weakened by a core context's local needs. Fans out to four consumers.","source":"docs/adr/ADR-005-governance-as-separate-container.md"},{"id":"CACHE","view":"final","kind":"store","status":"info","label":"Redis — tiered TTL","badge":"status-aware keys","x":880,"y":310,"w":280,"h":66,"tooltip":"Tiered TTL by workflow risk, with cache-correctness evals. If Redis is unreachable the system falls back to no-cache — never serving a response as-if-cached. Correctness over performance, always.","source":"docs/architecture/c4/boundary_and_degraded_mode.md"},{"id":"FAUD","view":"final","kind":"store","status":"info","label":"Audit Store — owned","badge":"ADR-006","x":880,"y":394,"w":280,"h":66,"tooltip":"Durable AgentRun records, separate from LangSmith because compliance retention requirements may differ from trace retention and this store must survive a degraded hosted integration. Azure realization: Blob Storage with WORM immutability.","source":"docs/adr/ADR-006-audit-store-separate-from-langsmith.md"},{"id":"FLS","view":"final","kind":"external","status":"neutral","label":"LangSmith — traces, evals, dashboards","x":880,"y":138,"w":280,"h":60,"tooltip":"Hosted observability. OpenTelemetry stays the instrumentation layer so the trace backend remains swappable. Traces must pass through redaction before storage — PII/PHI never leaves the Orchestrator API boundary unredacted.","source":"docs/architecture/c4/boundary_and_degraded_mode.md"},{"id":"FEP","view":"final","kind":"store","status":"warn","label":"Evidence & Provenance","badge":"+ semantic layer / KG","x":60,"y":656,"w":280,"h":70,"tooltip":"The shared evidence-authority model — one EvidenceItem contract all three core contexts conform to. Translates each source system's local representation before any core context sees it; core contexts may never reach past it to a raw source.","source":"docs/architecture/ddd/context_map.md"},{"id":"FSRC","view":"final","kind":"external","status":"neutral","label":"Brownfield systems","badge":"READ-ONLY, zero writes","x":60,"y":766,"w":280,"h":64,"tooltip":"Manufacturing, Laboratory, Quality, Safety and Supply estates. Zero write integrations — permanently, not 'phase 2'. Enforced twice over: at the architecture level here, and at the schema level in the domain model.","source":"docs/architecture/c4/c4_context.md"},{"id":"G1","view":"final","cluster":"f_gates","kind":"gate","status":"neutral","label":"1 · All 7 interim assumptions passed","x":60,"y":902,"w":180,"h":66,"tooltip":"Open. Cannot be closed by design work — requires the system to actually run.","source":"docs/product/state/final/final_state.md §5"},{"id":"G2","view":"final","cluster":"f_gates","kind":"gate","status":"ok","label":"2 · EAB-3 closed — named approvers ✓","x":255,"y":902,"w":180,"h":66,"tooltip":"Satisfied. Required a human answer rather than engineering work, and it was given: approvers named from V2's stakeholder pack.","source":"docs/governance/hitl_control_model.md"},{"id":"G3","view":"final","cluster":"f_gates","kind":"gate","status":"ok","label":"3 · EAB-2 resolved — cloud-connected ✓","x":450,"y":902,"w":180,"h":66,"tooltip":"Satisfied. Sponsor confirmed cloud-connected operation; the air-gapped variant is recorded as a known limitation rather than silently dropped.","source":"docs/adr/ADR-007-degraded-mode-safe-not-offline-capable.md"},{"id":"G4","view":"final","cluster":"f_gates","kind":"gate","status":"ok","label":"4 · DDD + C4 → stable ✓","x":645,"y":902,"w":180,"h":66,"tooltip":"Satisfied. Both artifacts were upgraded when their blocking evidence items closed.","source":"docs/architecture/"},{"id":"G5","view":"final","cluster":"f_gates","kind":"gate","status":"ok","label":"5 · all 8 ADRs ratified ✓","x":840,"y":902,"w":180,"h":66,"tooltip":"Satisfied. No ADR now rests on an unconfirmed assumption. (ADR-009 was added subsequently as a sponsor directive, with one open sub-decision on the model-hosting route.)","source":"docs/adr/decision_index.md"},{"id":"G6","view":"final","cluster":"f_gates","kind":"gate","status":"neutral","label":"6 · Zero prohibited-action findings","x":60,"y":996,"w":180,"h":66,"tooltip":"Open. Across evals (Stage 14) and red-team (Stage 18). Cannot be closed by design work.","source":"docs/product/state/final/final_state.md §5"},{"id":"G7","view":"final","cluster":"f_gates","kind":"gate","status":"neutral","label":"7 · Compliance evidence from real runs","x":255,"y":996,"w":180,"h":66,"tooltip":"Open. EU AI Act and ISO 42001 evidence produced from actual operation — not documented intent. Cannot be closed by design work.","source":"docs/product/state/final/final_state.md §5"},{"id":"DONE","view":"final","cluster":"f_gates","kind":"gate","status":"info","label":"FINAL STATE COMPLETE","x":480,"y":996,"w":250,"h":66,"tooltip":"Four of seven gates are satisfied. The three remaining ones require the system to run — no amount of further design work can close them.","source":"docs/product/state/final/final_state.md §5"},{"id":"I1","view":"final","cluster":"f_di","kind":"delta","status":"neutral","label":"1 workflow","x":74,"y":1206,"w":148,"h":52,"tooltip":"Interim: Batch Review only.","source":"docs/product/state/final/final_state.md §4"},{"id":"I2","view":"final","cluster":"f_di","kind":"delta","status":"neutral","label":"2 MCP tools","x":234,"y":1206,"w":148,"h":52,"tooltip":"Interim: Evidence Retrieval + Reconciliation.","source":"docs/product/state/final/final_state.md §4"},{"id":"I3","view":"final","cluster":"f_di","kind":"delta","status":"neutral","label":"no cache","x":394,"y":1206,"w":148,"h":52,"tooltip":"Interim: deliberately excluded, to keep failures unambiguous.","source":"docs/product/state/final/final_state.md §4"},{"id":"I4","view":"final","cluster":"f_di","kind":"delta","status":"neutral","label":"1 approver (QP)","x":74,"y":1274,"w":148,"h":52,"tooltip":"Interim: proves the HITL mechanism with one named role.","source":"docs/product/state/final/final_state.md §4"},{"id":"I5","view":"final","cluster":"f_di","kind":"delta","status":"neutral","label":"tracing only","x":234,"y":1274,"w":148,"h":52,"tooltip":"Interim: enough trace data to answer the seven assumption questions.","source":"docs/product/state/final/final_state.md §4"},{"id":"I6","view":"final","cluster":"f_di","kind":"delta","status":"neutral","label":"no compliance evidence","x":394,"y":1274,"w":148,"h":52,"tooltip":"Interim: compliance evidence requires a system that has actually run.","source":"docs/product/state/final/final_state.md §4"},{"id":"F1","view":"final","cluster":"f_df","kind":"delta","status":"ok","label":"3 workflows","x":664,"y":1206,"w":148,"h":52,"tooltip":"Batch Review, PV Intake, Supply Planning — as three separate graphs in one deployment.","source":"docs/product/state/final/final_state.md §4"},{"id":"F2","view":"final","cluster":"f_df","kind":"delta","status":"ok","label":"4 MCP tools","x":824,"y":1206,"w":148,"h":52,"tooltip":"Shared Evidence Retrieval plus three workflow-bound tools, none carrying a write capability.","source":"docs/product/state/final/final_state.md §4"},{"id":"F3","view":"final","cluster":"f_df","kind":"delta","status":"ok","label":"Redis + correctness evals","x":984,"y":1206,"w":148,"h":52,"tooltip":"Cache lands only after the uncached path is proven correct, so cache-correctness is a separately-tested risk rather than a confound.","source":"docs/product/state/final/final_state.md §4"},{"id":"F4","view":"final"," ch","kind":"solid"},{"id":"e_f6","view":"final","from":"FA1","to":"FC1","kind":"solid"},{"id":"e_f7","view":"final","from":"FA2","to":"FC2","kind":"solid"},{"id":"e_f8","view":"final","from":"FA3","to":"FC3","kind":"solid"},{"id":"e_f9","view":"final","from":"FA1","to":"FT1","kind":"bidirectional"},{"id":"e_f10","view":"final","from":"FA1","to":"FT2","kind":"bidirectional"},{"id":"e_f11","view":"final","from":"FA2","to":"FT1","kind":"bidirectional"},{"id":"e_f12","view":"final","from":"FA2","to":"FT3","kind":"bidirectional"},{"id":"e_f13","view":"final","from":"FA3","to":"FT1","kind":"bidirectional"},{"id":"e_f14","view":"final","from":"FA3","to":"FT4","kind":"bidirectional"},{"id":"e_f15","view":"final","from":"FT1","to":"FEP","kind":"solid"},{"id":"e_f16","view":"final","from":"FEP","to":"FSRC","kind":"solid","label":"read-only"},{"id":"e_f17","view":"final","from":"cluster:f_orch","to":"CACHE","kind":"bidirectional"},{"id":"e_f18","view":"final","from":"cluster:f_orch","to":"GOV","kind":"dashed","label":"every output"},{"id":"e_f19","view":"final","from":"cluster:f_orch","to":"FAUD","kind":"solid"},{"id":"e_f20","view":"final","from":"cluster:f_orch","to":"FLS","kind":"dashed","label":"traces"},{"id":"e_f21","view":"final","from":"FC1","to":"QA","kind":"solid","label":"for review"},{"id":"e_f22","view":"final","from":"FC2","to":"PVP","kind":"solid","label":"for review"},{"id":"e_f23","view":"final","from":"FC3","to":"SC","kind":"solid","label":"for review"},{"id":"e_f24","view":"final","from":"G2","to":"G4","kind":"solid"},{"id":"e_f25","view":"final","from":"G3","to":"G4","kind":"solid"},{"id":"e_f26","view":"final","from":"G4","to":"G5","kind":"solid"},{"id":"e_f27","view":"final","from":"G5","to":"DONE","kind":"solid"},{"id":"e_f28","view":"final","from":"G1","to":"DONE","kind":"solid"},{"id":"e_f29","view":"final","from":"G6","to":"DONE","kind":"solid"},{"id":"e_f30","view":"final","from":"G7","to":"DONE","kind":"solid"},{"id":"e_f31","view":"final","from":"I1","to":"F1","kind":"solid"},{"id":"e_f32","view":"final","from":"I2","to":"F2","kind":"solid"},{"id":"e_f33","view":"final","from":"I3","to":"F3","kind":"solid"},{"id":"e_f34","view":"final","from":"I4","to":"F4","kind":"solid"},{"id":"e_f35","view":"final","from":"I5","to":"F5","kind":"solid"},{"id":"e_f36","view":"final","from":"I6","to":"F6","kind":"solid"}],"flows":[{"id":"cur.pipeline","view":"current","kind":"path","label":"Completed design pipeline (Stages 01→05)","summary":"Five stages of design artefacts, each building on the last, ending at the current-state measurement that everything below is scaffold.","steps":[{"node":"S1","note":"Discovery and SCQA frame the problem and raise the evidence-acquisition backlog."},{"node":"S2","note":"DDD defines bounded contexts, agents, and the schema-level prohibitions."},{"node":"S3","note":"C4 turns those contexts into nine containers with named repo homes."},{"node":"S4","note":"Eight ADRs ratify the contested choices; ADR-003 corrects a DDD error."},{"node":"S5","note":"Current state re-measured in its post-ADR position: zero implementation."},{"node":"P1","note":"Everything from Stage 06 onward was scaffold at the time of measurement."}]},{"id":"cur.eab2","view":"current","kind":"path","label":"EAB-2 closure unblocks implementation","summary":"The air-gap question was blocking every hosted dependency, and therefore the implementation stages.","steps":[{"node":"B1","note":"Sponsor confirmed cloud-connected operation is acceptable."},{"node":"P4","note":"Implementation and documentation are no longer gated on an unresolved deployment constraint."}]},{"id":"cur.eab3","view":"current","kind":"path","label":"EAB-3 closure unblocks the assurance stages","summary":"Named accountable approvers are a precondition for governance, security and compliance work.","steps":[{"node":"B2","note":"Roles taken verbatim from V2's stakeholder pack — not invented."},{"node":"P3","note":"Governance, observability, security and compliance stages can now proceed."}]},{"id":"cur.nab4","view":"current","kind":"path","label":"Unconsumed asset — eval-ai-cache should feed Stages 14/15/17","summary":"The amber box: 29 files of directly-applicable reference material that no stage has drawn on yet.","steps":[{"node":"R4","note":"A 24-file brownfield-evals runbook, a Redis caching runbook, an OpenTelemetry runbook."},{"node":"P3","note":"Consume these rather than deriving equivalents (NAB-4)."}]},{"id":"cur.invariant","view":"current","kind":"invariant","label":"Invariant — there is no system yet","summary":"Every architectural claim made so far is unvalidated by execution. That is correct and intentional (Stage 20 is deliberately last), not an oversight. The empty evidence/ tree is the honest signal.","steps":[{"node":"T1c","note":"Zero implementation across apps, services, packages and tests."},{"node":"T2c","note":"Operational scaffolding awaiting Stages 15–19."},{"node":"T3c","note":"Zero evidence records — correct, because nothing has run."},{"node":"T4c","note":"Ten blank templates ready for use."}]},{"id":"int.happy","view":"interim","kind":"path","label":"Batch Review — the governed happy path","summary":"The minimum governed workflow, and the seven-boundary-crossing baseline the C4 DMAIC lens counted. Any design change that raises this hop count needs an explicit justification.","steps":[{"node":"USER","note":"The EU Qualified Person opens a batch for review."},{"node":"UI","note":"Hop 1 — Web App to Orchestrator API."},{"node":"BA","note":"Hop 2 — the Batch-Review Agent node takes its reasoning turn."},{"node":"IT1","note":"Hop 3 — scoped evidence retrieval via MCP."},{"node":"EP","note":"Hop 4 — the Evidence & Provenance store resolves authority deterministically."},{"node":"SRC","note":"Read-only access to Manufacturing, Lab and Quality systems. No arrow points back out."},{"node":"BA","note":"Return — the agent reasons over retrieved, status-gated evidence."},{"node":"CV","note":"Hop 5 — the Critic/Verifier checks prohibited-action adjacency and citation completeness."},{"node":"PAG","note":"Hop 6 — the Prohibited-Action Guard runs on every output."},{"node":"HITL","note":"Hop 7 — the interrupt handler routes to the named approver."},{"node":"USER","note":"The human decides. The system never certifies."}]},{"id":"int.a1","view":"interim","kind":"path","label":"Assumption 1 — prohibited action fails at the schema layer","summary":"Stop-the-line. A red-team attempt to produce a release/reject recommendation must fail structurally, not merely by model refusal. If this fails, the design itself is invalid.","steps":[{"node":"BA","note":"The Batch aggregate cannot carry a release_recommended or reject_recommended field at all."},{"node":"CV","note":"The Critic checks the proposed output against the prohibited-action contract."},{"node":"PAG","note":"The guard is a hook, present from day one — ADR-004 holds that it cannot be retrofitted safely."},{"node":"A1","note":"Pass condition: the attempt fails at the schema layer."}]},{"id":"int.a2","view":"interim","kind":"path","label":"Assumption 2 — evidence authority gate (ADR-003)","summary":"Stop-the-line. untrusted and superseded documents are both non-citable, and both must be filtered at the retrieval boundary so they never enter the agent's context window.","steps":[{"node":"SRC","note":"Brownfield sources carry documents in mixed authority states."},{"node":"EP","note":"The deterministic status gate. Verified against V2's authority_grader.py, which corrected an error in the original DDD model."},{"node":"IT1","note":"Filtering happens at retrieval, not by asking the model to recognise untrustworthiness."},{"node":"BA","note":"The agent never sees a non-citable document. Retrieved content can never alter its own authority."},{"node":"A2","note":"Pass condition: zero citations of untrusted or superseded, and embedded instructions change nothing."}]},{"id":"int.a3","view":"interim","kind":"path","label":"Assumption 3 — HITL routing and default-safe timeout","summary":"Silence from a human reviewer must never be treated as approval. A timed-out approval results in no action.","steps":[{"node":"CV","note":"The Critic approves the output for human review."},{"node":"HITL","note":"Execution pauses; the named approver role is notified."},{"node":"USER","note":"If the EU Qualified Person does not respond, escalation routes to the Chief Quality Officer."},{"node":"AUD","note":"Every HITL decision — approve, reject, or timeout — is recorded."},{"node":"A3","note":"Pass condition: escalation fires as designed and timeout means no action."}]},{"id":"int.a4","view":"interim","kind":"path","label":"Assumption 4 — degraded mode is safe (ADR-007)","summary":"V3 is not offline-capable the way V2's static app was; it is degraded-mode-safe. Every hosted dependency has a defined fallback that preserves correctness even where it sacrifices capability.","steps":[{"node":"BA","note":"With the LLM provider unreachable, the deterministic path still runs and the system abstains rather than guessing."},{"node":"LS","note":"With LangSmith unreachable, the request must not block — trace locally and sync later."},{"node":"AUD","note":"This is why the audit store is a separate container: it keeps writing when hosted observability is down."},{"node":"A4","note":"Pass condition: requests still succeed and audit records still write."}]},{"id":"int.a5","view":"interim","kind":"path","label":"Assumption 5 — the Policy Engine fails closed","summary":"With the Policy Engine unreachable, requests are refused rather than passed through. The failure direction is the whole point of making governance a separate container.","steps":[{"node":"CV","note":"The Critic cannot reach the guard."},{"node":"PAG","note":"Unreachable — and therefore blocking, not bypassed."},{"node":"HITL","note":"The request is refused. No output proceeds to a human as if it had been checked."},{"node":"A5","note":"Pass condition: refusal, not pass-through."}]},{"id":"int.nocache","view":"interim","kind":"invariant","label":"Invariant — the cache is deliberately absent","summary":"Introducing stale-authority risk alongside agent-correctness risk makes failures ambiguous. The cache lands only after the uncached path is proven correct, so cache-correctness becomes a separately-tested risk rather than a confound.","steps":[{"node":"NOCACHE","note":"Excluded on purpose — this absence is the design decision."},{"node":"A6","note":"The first real token/cost measurement is taken on the uncached path, so the number means something."}]},{"id":"int.gate","view":"interim","kind":"path","label":"All seven assumptions → proceed decision","summary":"The interim state's exit criteria. Assumption 6 carries disproportionate weight: it is the first point in the whole programme where a real cost number exists.","steps":[{"node":"A1","note":"Stop-the-line if it fails."},{"node":"A2","note":"Stop-the-line if it fails."},{"node":"A3","note":"Design correction if it fails."},{"node":"A4","note":"Design correction if it fails."},{"node":"A5","note":"Design correction if it fails."},{"node":"A6","note":"If measured cost is far off expectation, the final topology changes before it is built three times over."},{"node":"A7","note":"Measured path should be about seven crossings, or there is a documented reason why not."},{"node":"GATE","note":"Only then is the pattern replicated across three workflows."}]},{"id":"fin.graphA","view":"final","kind":"path","label":"Graph A — Batch Review","summary":"The proven interim pattern, now one of three isolated graphs in a single deployment. Terminal certification stays human-only.","steps":[{"node":"QA","note":"The EU Qualified Person opens a batch."},{"node":"WEB","note":"One presentation layer over all three core contexts."},{"node":"FA1","note":"The Batch-Review Agent reasons within Graph A only."},{"node":"FT1","note":"Evidence Retrieval, scoped to Batch Review's evidence — never PV or Supply knowledge."},{"node":"FEP","note":"The shared evidence-authority model resolves status and supersession."},{"node":"FSRC","note":"Read-only. Zero write integrations, permanently."},{"node":"FT2","note":"Reconciliation — structured evidence-completeness and conflict check."},{"node":"FC1","note":"The Critic checks the output through the common DecisionSupportOutput contract."},{"node":"GOV","note":"Every output passes the policy engine, which fails closed."},{"node":"QA","note":"Decision support reaches the human. The system never certifies."}]},{"id":"fin.graphB","view":"final","kind":"path","label":"Graph B — PV Intake","summary":"100% of causality, seriousness and reportability determinations route to a human — because the agent's output schema has no such fields at all.","steps":[{"node":"PVP","note":"The Global Head of Pharmacovigilance owns this context."},{"node":"WEB","note":"Same presentation layer, different workflow view."},{"node":"FA2","note":"The PV-Intake Agent triages and prioritises; it cannot determine causality."},{"node":"FT1","note":"Evidence Retrieval, scoped to PV's evidence."},{"node":"FEP","note":"Same shared evidence contract — core contexts do not get their own evidence semantics."},{"node":"FT3","note":"Duplicate-Check must complete before a signal can be triaged."},{"node":"FC2","note":"The Critic verifies prohibited-action adjacency and citation completeness."},{"node":"GOV","note":"The HITL Router sends 100% of determinations to the named approver."},{"node":"PVP","note":"Final safety decisions remain human-only."}]},{"id":"fin.graphC","view":"final","kind":"path","label":"Graph C — Supply Planning (dual approval)","summary":"Options are non-executing by construction. The Supply Chain VP is limited to planning, so anything touching quality status also needs Quality sign-off.","steps":[{"node":"SC","note":"The Supply Chain VP requests shortage or cold-chain options."},{"node":"WEB","note":"Same presentation layer."},{"node":"FA3","note":"The Supply-Planning Agent generates ranked, non-executing options."},{"node":"FT1","note":"Evidence Retrieval, scoped to Supply's evidence."},{"node":"FEP","note":"Evidence authority resolved once, shared by all three contexts."},{"node":"FT4","note":"Option-Generation has no allocate or reserve method — a tool-capability constraint, not a permission."},{"node":"FC3","note":"The Critic checks that no ShortageOption carries an allocated_quantity-shaped field."},{"node":"GOV","note":"100% routing — option sets are never self-executing."},{"node":"SC","note":"The VP approves planning."},{"node":"QA","note":"Quality co-approval wherever quality status is implicated."}]},{"id":"fin.evidence","view":"final","kind":"path","label":"Shared evidence path — one authority model, three consumers","summary":"Evidence & Provenance is an upstream shared kernel: all three core contexts consume the identical authority model as conformist downstreams, and none may reach past it to a raw source system.","steps":[{"node":"FSRC","note":"The brownfield estate, where no system is universally authoritative."},{"node":"FEP","note":"Translates each source's local representation into the common EvidenceItem value object."},{"node":"FT1","note":"One shared retrieval tool, scoped per bounded context at call time."},{"node":"FA1","note":"Batch Review sees only Batch Review evidence."},{"node":"FA2","note":"PV Intake sees only PV evidence."},{"node":"FA3","note":"Supply Planning sees only Supply evidence."}]},{"id":"fin.governance","view":"final","kind":"path","label":"Governance, audit and observability","summary":"The policy engine is upstream of everything as an open-host service; the audit store is owned and deliberately separate from the hosted trace backend.","steps":[{"node":"GOV","note":"Prohibited-Action Guard, HITL Router, Policy Register — versioned independently so it cannot be locally weakened."},{"node":"FAUD","note":"Durable AgentRun records. Separate from LangSmith because compliance retention may differ from trace retention."},{"node":"FLS","note":"Hosted traces, evals and dashboards — additive, never a hard dependency."},{"node":"ADM","note":"The run inspector and eval dashboards read observability rather than driving workflows."}]},{"id":"fin.cache","view":"final","kind":"path","label":"Cache path — correctness over performance","summary":"Tiered TTL by workflow risk with status-aware keys. If Redis is unreachable the system falls back to no-cache; it never serves a response as-if-cached.","steps":[{"node":"CACHE","note":"Introduced only after the uncached path was proven correct in the interim state."},{"node":"FEP","note":"Cache keys are status-aware, because a superseded document must not survive in cache as citable."}]},{"id":"fin.gates","view":"final","kind":"path","label":"Completion gates — four satisfied, three open","summary":"Gates 2 and 3 required human answers rather than engineering work, and both were given. The three remaining gates cannot be closed by design work at all — they require the system to actually run.","steps":[{"node":"G2","note":"Satisfied — named approvers exist for all three workflows."},{"node":"G3","note":"Satisfied — cloud-connected operation confirmed."},{"node":"G4","note":"Satisfied — DDD and C4 both stable."},{"node":"G5","note":"Satisfied — all eight ADRs ratified."},{"node":"G1","note":"Open — requires the seven interim assumptions to pass in a real run."},{"node":"G6","note":"Open — requires zero prohibited-action findings across evals and red-team."},{"node":"G7","note":"Open — requires compliance evidence from real runs, not documented intent."},{"node":"DONE","note":"Declarable only when all seven hold."}]},{"id":"fin.delta","view":"final","kind":"path","label":"Interim → final delta","summary":"Six dimensions that widen once the pattern is proven once. Note that Supply Planning's dual approval is a constraint the stakeholder pack encodes, not an added formality.","steps":[{"node":"I1","note":"One workflow…"},{"node":"F1","note":"…becomes three."},{"node":"I2","note":"Two MCP tools…"},{"node":"F2","note":"…become four."},{"node":"I3","note":"No cache…"},{"node":"F3","note":"…becomes Redis plus cache-correctness evals."},{"node":"I4","note":"One approver…"},{"node":"F4","note":"…becomes all three, including Supply dual-approval."},{"node":"I5","note":"Tracing only…"},{"node":"F5","note":"…becomes dashboards, alerts and SLOs."},{"node":"I6","note":"No compliance evidence…"},{"node":"F6","note":"…becomes EU AI Act and ISO 42001 evidence from real runs."}]},{"id":"fin.absent","view":"final","kind":"invariant","label":"Invariant — the absent arrows are the design","summary":"Two absences in this diagram are permanent architectural commitments, not omissions: there is no edge between Graphs A, B and C, and there is no arrow into the brownfield systems.","steps":[{"node":"FA1","note":"No cross-graph agent calls — ADR-008 forbids them permanently."},{"node":"FA2","note":"Any cross-workflow need routes through Evidence & Provenance or Governance, never context-to-context."},{"node":"FA3","note":"A generalist agent holding all three prohibition lists in one context was explicitly rejected."},{"node":"FSRC","note":"Zero write integrations — enforced twice, at architecture level and at schema level."},{"node":"FT4","note":"The Supply tool has no allocate method at all, so the prohibited action is unrepresentable rather than merely disallowed."}]}]};

const byId = {};
GRAPH.nodes.forEach(n => byId[n.id] = n);
const clusterById = {};
GRAPH.clusters.forEach(c => clusterById[c.id] = c);

/* ---------------- geometry ---------------- */
function boxOf(ref) {
  if (typeof ref === "string" && ref.startsWith("cluster:")) {
    const c = clusterById[ref.slice(8)];
    return c ? { x: c.x, y: c.y, w: c.w, h: c.h } : null;
  }
  const n = byId[ref];
  return n ? { x: n.x, y: n.y, w: n.w, h: n.h } : null;
}
const cx = b => b.x + b.w / 2, cy = b => b.y + b.h / 2;

function sideOf(a, b) {
  const dx = cx(b) - cx(a), dy = cy(b) - cy(a);
  if (Math.abs(dx) / (a.w / 2 + 1) > Math.abs(dy) / (a.h / 2 + 1)) return dx > 0 ? "R" : "L";
  return dy > 0 ? "B" : "T";
}
const NORMAL = { L: [-1, 0], R: [1, 0], T: [0, -1], B: [0, 1] };

/* Distribute anchors so parallel edges leaving the same side do not overlap. */
function computeAnchors(edges) {
  const slots = new Map();
  const meta = edges.map(e => {
    const a = boxOf(e.from), b = boxOf(e.to);
    if (!a || !b) return null;
    const sa = sideOf(a, b), sb = sideOf(b, a);
    const ka = e.from + "|" + sa, kb = e.to + "|" + sb;
    if (!slots.has(ka)) slots.set(ka, []); slots.get(ka).push({ e, end: "a", other: cy(b) + cx(b) / 1000 });
    if (!slots.has(kb)) slots.set(kb, []); slots.get(kb).push({ e, end: "b", other: cy(a) + cx(a) / 1000 });
    return { e, a, b, sa, sb, ka, kb };
  }).filter(Boolean);

  const pos = new Map();
  for (const [key, list] of slots) {
    const [ref, side] = [key.slice(0, key.lastIndexOf("|")), key.slice(key.lastIndexOf("|") + 1)];
    const box = boxOf(ref);
    const horiz = side === "T" || side === "B";
    list.sort((p, q) => p.other - q.other);
    list.forEach((item, i) => {
      const frac = (i + 1) / (list.length + 1);
      const p = horiz
        ? { x: box.x + box.w * frac, y: side === "T" ? box.y : box.y + box.h }
        : { x: side === "L" ? box.x : box.x + box.w, y: box.y + box.h * frac };
      pos.set(item.e.id + item.end, p);
    });
  }
  return { meta, pos };
}

function edgePath(m, pos) {
  const p0 = pos.get(m.e.id + "a"), p3 = pos.get(m.e.id + "b");
  const na = NORMAL[m.sa], nb = NORMAL[m.sb];
  const d = Math.hypot(p3.x - p0.x, p3.y - p0.y);
  const off = Math.max(28, Math.min(90, d * 0.42));
  const p1 = { x: p0.x + na[0] * off, y: p0.y + na[1] * off };
  const p2 = { x: p3.x + nb[0] * off, y: p3.y + nb[1] * off };
  const mid = {
    x: (p0.x + 3 * p1.x + 3 * p2.x + p3.x) / 8,
    y: (p0.y + 3 * p1.y + 3 * p2.y + p3.y) / 8
  };
  return { d: `M${p0.x},${p0.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`, mid, p0, p3 };
}

/* ---------------- text ---------------- */
function wrap(text, width, fontSize) {
  const max = Math.max(6, Math.floor((width - 18) / (fontSize * 0.545)));
  const out = [];
  for (const para of String(text).split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/)) {
      if (!line.length) { line = word; continue; }
      if ((line + " " + word).length <= max) line += " " + word;
      else { out.push(line); line = word; }
    }
    out.push(line);
  }
  return out;
}

/* ---------------- render ---------------- */
function render() {
  const view = GRAPH.views.find(v => v.id === state.view);
  stage.innerHTML = "";

  const defs = el("defs");
  for (const [id, color] of [["arw", "var(--edge)"], ["arwhl", "var(--edge-hl)"]]) {
    const mk = el("marker", { id, viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
    mk.appendChild(el("path", { d: "M0,1 L10,5 L0,9 z", fill: color }));
    defs.appendChild(mk);
  }
  stage.appendChild(defs);

  root = el("g");
  stage.appendChild(root);
  layers = {
    clusters: el("g"), edges: el("g"), nodes: el("g"), badges: el("g")
  };
  Object.values(layers).forEach(g => root.appendChild(g));

  // clusters (parents first)
  GRAPH.clusters.filter(c => c.view === state.view)
    .sort((a, b) => (a.parent ? 1 : 0) - (b.parent ? 1 : 0))
    .forEach(c => {
      const g = el("g", { class: "cluster" });
      g.appendChild(el("rect", { class: "cluster-box", x: c.x, y: c.y, width: c.w, height: c.h,
        rx: 12, fill: "var(--line-2)", stroke: "var(--line)", "stroke-dasharray": c.parent ? "4 4" : "" }));
      const t = el("text", { class: "cluster-label", x: c.x + 13, y: c.y + 17 });
      t.textContent = c.label;
      g.appendChild(t);
      layers.clusters.appendChild(g);
    });

  // edges
  const edges = GRAPH.edges.filter(e => e.view === state.view);
  const { meta, pos } = computeAnchors(edges);
  const edgeEls = new Map();
  meta.forEach(m => {
    const { d, mid } = edgePath(m, pos);
    const g = el("g", { class: "edge" + (m.e.kind === "dashed" ? " dashed" : ""), "data-id": m.e.id });
    g.appendChild(el("path", { class: "ehit", d }));
    const p = el("path", { d, "marker-end": "url(#arw)" });
    if (m.e.kind === "bidirectional") p.setAttribute("marker-start", "url(#arw)");
    g.appendChild(p);
    if (m.e.label) {
      const pad = 3, fs = 10, w = m.e.label.length * fs * 0.54 + pad * 2;
      g.appendChild(el("rect", { x: mid.x - w / 2, y: mid.y - 8, width: w, height: 14, rx: 4,
        fill: "var(--canvas)", opacity: ".92" }));
      const t = el("text", { class: "elabel", x: mid.x, y: mid.y + 2.5, "text-anchor": "middle" });
      t.textContent = m.e.label;
      g.appendChild(t);
    }
    if (m.e.tooltip || m.e.label) {
      g.addEventListener("mouseenter", ev => showTip(ev, {
        name: (byId[m.e.from]?.label || m.e.from).split("\n")[0] + "  →  " + (byId[m.e.to]?.label || m.e.to).split("\n")[0],
        kind: m.e.kind === "bidirectional" ? "Bidirectional" : m.e.kind === "dashed" ? "Dashed relation" : "Relation",
        body: m.e.tooltip || m.e.label, status: "neutral"
      }));
      g.addEventListener("mousemove", moveTip);
      g.addEventListener("mouseleave", hideTip);
    }
    edgeEls.set(m.e.id, g);
    layers.edges.appendChild(g);
  });

  // nodes
  const nodeEls = new Map();
  GRAPH.nodes.filter(n => n.view === state.view).forEach(n => {
    const [sc, sb] = STATUS_VAR[n.status] || STATUS_VAR.neutral;
    const g = el("g", { class: "node", "data-id": n.id, tabindex: "0" });
    g.appendChild(el("rect", { class: "ring", x: n.x - 4, y: n.y - 4, width: n.w + 8, height: n.h + 8, rx: 13,
      fill: "none", stroke: "none" }));
    g.appendChild(el("rect", { class: "box", x: n.x, y: n.y, width: n.w, height: n.h, rx: 9,
      fill: `var(${sb})`, stroke: `var(${sc})`,
      "stroke-dasharray": n.kind === "excluded" ? "5 4" : "" }));

    const lines = wrap(n.label, n.w, 12);
    const hasBadge = !!n.badge;
    const badgeLines = hasBadge ? wrap(n.badge, n.w, 9.8) : [];
    const lh = 14, blh = 11.5;
    const total = lines.length * lh + (hasBadge ? badgeLines.length * blh + 3 : 0);
    let y = n.y + n.h / 2 - total / 2 + 10.5;
    lines.forEach(ln => {
      const t = el("text", { class: "nlabel", x: n.x + n.w / 2, y, "text-anchor": "middle", fill: "var(--ink)" });
      t.textContent = ln; g.appendChild(t); y += lh;
    });
    if (hasBadge) {
      y += 1;
      badgeLines.forEach(ln => {
        const t = el("text", { class: "nbadge", x: n.x + n.w / 2, y, "text-anchor": "middle", fill: `var(${sc})` });
        t.textContent = ln; g.appendChild(t); y += blh;
      });
    }

    g.addEventListener("mouseenter", ev => showTip(ev, {
      name: n.label.replace(/\n/g, " "), kind: KIND_LABEL[n.kind] || n.kind,
      body: n.tooltip, src: n.source, status: n.status
    }));
    g.addEventListener("mousemove", moveTip);
    g.addEventListener("mouseleave", hideTip);
    g.addEventListener("focus", ev => showTipAtNode(g, n));
    g.addEventListener("blur", hideTip);
    g.addEventListener("click", () => {
      const f = GRAPH.flows.find(f => f.view === state.view && f.steps.some(s => s.node === n.id));
      if (f) selectFlow(f.id);
    });

    nodeEls.set(n.id, g);
    layers.nodes.appendChild(g);
  });

  render._edgeEls = edgeEls;
  render._nodeEls = nodeEls;
  render._canvas = view.canvas;

  document.getElementById("viewnote").innerHTML =
    `<b>${escapeHtml(view.label)} — ${escapeHtml(view.subtitle)}.</b> ${escapeHtml(view.note)}`;
  document.getElementById("panelSub").textContent =
    `${GRAPH.flows.filter(f => f.view === state.view).length} flows in this view. Select one to trace its full path.`;

  applyHighlight();
  fit();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------------- highlight ---------------- */
/* Every id an edge may legitimately be attached to for a given node: the node itself,
   its cluster, and that cluster's parent (cluster-anchored edges such as
   "cluster:f_orch -> GOV" belong to every node inside the orchestrator boundary). */
function keysOf(id) {
  const n = byId[id];
  const k = [id];
  if (n && n.cluster) {
    k.push("cluster:" + n.cluster);
    const c = clusterById[n.cluster];
    if (c && c.parent) k.push("cluster:" + c.parent);
  }
  return k;
}
function matchEdge(e, aId, bId) {
  const A = keysOf(aId), B = keysOf(bId);
  return (A.includes(e.from) && B.includes(e.to)) || (A.includes(e.to) && B.includes(e.from));
}
/* An edge is part of the path when BOTH its endpoints are on the flow — not merely when
   two steps happen to be adjacent. A flow visits nodes in reading order, but the wiring
   between them is the diagram's, so consecutive-pair matching would leave real edges dark
   and highlighted boxes floating unconnected. */
function edgesOnPath(nodeIds) {
  const attach = new Set();
  nodeIds.forEach(id => keysOf(id).forEach(k => attach.add(k)));
  const out = new Set();
  for (const e of GRAPH.edges) {
    if (e.view !== state.view) continue;
    if (attach.has(e.from) && attach.has(e.to)) out.add(e.id);
  }
  return out;
}

function applyHighlight() {
  const nodeEls = render._nodeEls, edgeEls = render._edgeEls;
  layers.badges.innerHTML = "";
  const flow = GRAPH.flows.find(f => f.id === state.flow);

  if (!flow) {
    nodeEls.forEach(g => g.classList.remove("dim", "hl", "focus"));
    edgeEls.forEach(g => g.classList.remove("dim", "hl"));
    edgeEls.forEach(g => g.querySelectorAll("path")[1].setAttribute("marker-end", "url(#arw)"));
    return;
  }

  const seq = flow.steps.map(s => s.node);
  const nodeSet = new Set(seq);
  const hlEdges = edgesOnPath(seq);

  // The single hop into the focused step, emphasised above the rest of the path.
  const focusEdges = new Set();
  if (state.step > 0) {
    for (const e of GRAPH.edges) {
      if (e.view === state.view && matchEdge(e, seq[state.step - 1], seq[state.step])) focusEdges.add(e.id);
    }
  }

  nodeEls.forEach((g, id) => {
    const on = nodeSet.has(id);
    g.classList.toggle("dim", !on);
    g.classList.toggle("hl", on);
    g.classList.remove("focus");
    if (on) g.querySelector("rect.ring").setAttribute("stroke", "var(--edge-hl)");
  });
  edgeEls.forEach((g, id) => {
    const on = hlEdges.has(id);
    g.classList.toggle("dim", !on);
    g.classList.toggle("hl", on);
    g.classList.toggle("focus", focusEdges.has(id));
    g.querySelectorAll("path")[1].setAttribute("marker-end", on ? "url(#arwhl)" : "url(#arw)");
  });

  // numbered step badges, first occurrence of each node
  const seen = new Map();
  seq.forEach((id, i) => { if (!seen.has(id)) seen.set(id, []); seen.get(id).push(i + 1); });
  for (const [id, nums] of seen) {
    const n = byId[id]; if (!n) continue;
    const g = el("g", { class: "stepbadge" });
    g.appendChild(el("circle", { cx: n.x + n.w - 3, cy: n.y + 3, r: 10.5,
      stroke: "var(--canvas)", "stroke-width": 2 }));
    const t = el("text", { x: n.x + n.w - 3, y: n.y + 6.8 });
    t.textContent = nums.length > 1 ? nums[0] + "+" : nums[0];
    g.appendChild(t);
    layers.badges.appendChild(g);
  }

  if (state.step >= 0 && flow.steps[state.step]) {
    const g = nodeEls.get(flow.steps[state.step].node);
    if (g) g.classList.add("focus");
  }
}

/* ---------------- panel ---------------- */
function buildTabs() {
  const box = document.getElementById("tabs");
  box.innerHTML = "";
  GRAPH.views.forEach(v => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", v.id === state.view);
    b.textContent = v.label;
    b.onclick = () => { state.view = v.id; state.flow = null; state.step = -1; buildTabs(); buildFlows(); render(); syncClear(); };
    box.appendChild(b);
  });
}

function buildFlows() {
  const box = document.getElementById("flowlist");
  box.innerHTML = "";
  GRAPH.flows.filter(f => f.view === state.view).forEach(f => {
    const card = document.createElement("div");
    card.className = "flow" + (f.id === state.flow ? " active" : "");
    card.dataset.id = f.id;

    const btn = document.createElement("button");
    btn.innerHTML =
      `<span class="kind ${f.kind === "invariant" ? "invariant" : ""}">${f.kind === "invariant" ? "invariant" : "flow"}</span>` +
      `<span class="ftitle"><span class="fname">${escapeHtml(f.label)}</span>` +
      `<span class="fcount">${f.steps.length} steps</span></span>` +
      `<p class="fsum">${escapeHtml(f.summary)}</p>`;
    btn.onclick = () => selectFlow(f.id === state.flow ? null : f.id);
    card.appendChild(btn);

    if (f.id === state.flow) {
      const nav = document.createElement("div");
      nav.className = "stepnav";
      const prev = Object.assign(document.createElement("button"), { className: "btn", textContent: "‹ Prev" });
      const next = Object.assign(document.createElement("button"), { className: "btn", textContent: "Next ›" });
      const pos = document.createElement("span");
      pos.className = "pos";
      pos.textContent = state.step < 0 ? "whole path" : `step ${state.step + 1} / ${f.steps.length}`;
      prev.onclick = () => { state.step = state.step <= 0 ? f.steps.length - 1 : state.step - 1; buildFlows(); applyHighlight(); };
      next.onclick = () => { state.step = state.step >= f.steps.length - 1 ? -1 : state.step + 1; buildFlows(); applyHighlight(); };
      nav.append(prev, next, pos);
      card.appendChild(nav);

      const steps = document.createElement("div");
      steps.className = "steps";
      f.steps.forEach((s, i) => {
        const n = byId[s.node];
        const d = document.createElement("div");
        d.className = "step" + (i === state.step ? " on" : "");
        d.innerHTML = `<span class="num">${i + 1}</span><span class="stext">` +
          `<span class="slabel">${escapeHtml((n ? n.label : s.node).replace(/\n/g, " "))}</span>` +
          (s.note ? `<div class="snote">${escapeHtml(s.note)}</div>` : "") + `</span>`;
        d.onclick = () => { state.step = i; buildFlows(); applyHighlight(); };
        steps.appendChild(d);
      });
      card.appendChild(steps);
    }
    box.appendChild(card);
  });
}

function selectFlow(id) {
  state.flow = id; state.step = -1;
  buildFlows(); applyHighlight(); syncClear();
  const card = document.querySelector(`.flow[data-id="${id}"]`);
  if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function syncClear() { document.getElementById("clearBtn").hidden = !state.flow; }

function buildLegend() {
  const box = document.getElementById("legendItems");
  const items = [
    ["ok", "Complete / satisfied"], ["info", "Runtime component"], ["warn", "Guard or gate"],
    ["danger", "Excluded / stop-the-line"], ["neutral", "Not started / external"]
  ];
  box.innerHTML = items.map(([s, l]) =>
    `<span class="li"><span class="sw" style="background:var(${STATUS_VAR[s][1]});border-color:var(${STATUS_VAR[s][0]})"></span>${l}</span>`
  ).join("");
}

/* ---------------- tooltip ---------------- */
function showTip(ev, d) {
  const [sc] = STATUS_VAR[d.status] || STATUS_VAR.neutral;
  tip.innerHTML =
    `<div class="t-head"><span class="t-dot" style="background:var(${STATUS_VAR[d.status] ? STATUS_VAR[d.status][1] : "--neutral-bg"});border-color:var(${sc})"></span>` +
    `<span class="t-name">${escapeHtml(d.name)}</span></div>` +
    `<div class="t-kind">${escapeHtml(d.kind || "")}</div>` +
    (d.body ? `<div class="t-body" style="margin-top:5px">${escapeHtml(d.body)}</div>` : "") +
    (d.src ? `<div class="t-src">${escapeHtml(d.src)}</div>` : "");
  tip.classList.add("on");
  moveTip(ev);
}
function showTipAtNode(g, n) {
  const r = g.getBoundingClientRect();
  showTip({ clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 },
    { name: n.label.replace(/\n/g, " "), kind: KIND_LABEL[n.kind] || n.kind, body: n.tooltip, src: n.source, status: n.status });
}
function moveTip(ev) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function hideTip() { tip.classList.remove("on"); }

/* ---------------- pan / zoom ---------------- */
function applyTransform() {
  root.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.k})`);
}
function fit() {
  const r = stage.getBoundingClientRect();
  const c = render._canvas;
  const pad = 36;
  const k = Math.min((r.width - pad * 2) / c.width, (r.height - pad * 2) / c.height, 1.6);
  state.k = k;
  state.tx = (r.width - c.width * k) / 2;
  state.ty = (r.height - c.height * k) / 2;
  applyTransform();
}
function zoomBy(f, ox, oy) {
  const r = stage.getBoundingClientRect();
  const px = (ox ?? r.width / 2), py = (oy ?? r.height / 2);
  const k2 = Math.max(0.2, Math.min(3.5, state.k * f));
  state.tx = px - (px - state.tx) * (k2 / state.k);
  state.ty = py - (py - state.ty) * (k2 / state.k);
  state.k = k2;
  applyTransform();
}

let drag = null;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".node") || e.target.closest(".edge")) return;
  drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
  stage.classList.add("dragging");
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  state.tx = drag.tx + (e.clientX - drag.x);
  state.ty = drag.ty + (e.clientY - drag.y);
  applyTransform();
});
["pointerup", "pointercancel"].forEach(t => stage.addEventListener(t, () => { drag = null; stage.classList.remove("dragging"); }));
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

document.getElementById("zoomIn").onclick = () => zoomBy(1.2);
document.getElementById("zoomOut").onclick = () => zoomBy(1 / 1.2);
document.getElementById("zoomFit").onclick = () => fit();
document.getElementById("clearBtn").onclick = () => selectFlow(null);
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};

addEventListener("keydown", e => {
  if (e.key === "Escape") selectFlow(null);
  if (!state.flow) return;
  const f = GRAPH.flows.find(x => x.id === state.flow);
  if (e.key === "ArrowRight") { state.step = state.step >= f.steps.length - 1 ? -1 : state.step + 1; buildFlows(); applyHighlight(); }
  if (e.key === "ArrowLeft") { state.step = state.step <= 0 ? f.steps.length - 1 : state.step - 1; buildFlows(); applyHighlight(); }
});

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(fit, 120); });

buildTabs(); buildFlows(); buildLegend(); render(); syncClear();
</script>
</body>
</html>
